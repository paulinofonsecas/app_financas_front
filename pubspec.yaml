  flutter_hooks: ^0.20.5
  flutter_iconpicker: ^3.4.6
  flutter_launcher_icons: "^0.13.1"
  flutter_phoenix: ^1.1.1
  flutter_svg: ^2.0.7
  font_awesome_flutter: ^10.6.0
  get: ^4.6.5
  get_it: ^7.6.4
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
