  logger: ^2.1.0
  omni_datetime_picker:
    git:
      url: https://github.com/paulinofonsecas/OmniDateTimePicker
  path_provider: ^2.1.1
  provider: ^6.0.5
  searchable_listview: ^2.15.2
  u_credit_card: ^1.1.0
  uuid: ^4.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/imgs/logo.jpg"
  web:
    generate: true
    image_path: "assets/imgs/logo.jpg"
  windows:
    generate: true
    image_path: "assets/imgs/logo.jpg"
    icon_size: 48 # min:48, max:256, default: 48

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.3
  mocktail: ^1.0.1
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/
    - assets/imgs/bancos/
    - assets/imgs/profiles/
    - assets/svgs/home_page/
    - assets/svgs/categories/
    - assets/svgs/
    - shorebird.yaml
