name: app_financas
description: A new Flutter project.
publish_to: "none"
version: 1.0.3+3
environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  google_fonts: "6.1.0"
  flutter_svg: ^2.0.7
  dio: ^5.3.3
  http_mock_adapter: ^0.6.0
  dartz: ^0.10.1
  intl: ^0.18.1
  flutter_gutter: ^1.0.0
  infinite_scroll_pagination: ^4.0.0
  omni_datetime_picker:
    git:
      url: https://github.com/paulinofonsecas/OmniDateTimePicker
  provider: ^6.0.5
  hive: ^2.2.3
  path_provider: ^2.1.1
  hive_flutter: ^1.1.0
  u_credit_card: ^1.1.0
  flutter_colorpicker: ^1.0.3
  flutter_iconpicker: ^3.2.4
  fl_chart: ^0.66.2
  flutter_bloc: ^8.1.3
  bloc_test: ^9.1.5
  get_it: ^7.6.4
  equatable: ^2.0.5
  flutter_launcher_icons: "^0.13.1"
  device_preview: ^1.1.0
  font_awesome_flutter: ^10.6.0
  currency_text_input_formatter: ^2.1.11
  flutter_phoenix: ^1.1.1
  collection: ^1.18.0
  logger: ^2.1.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/imgs/logo.jpg"
  web:
    generate: true
    image_path: "assets/imgs/logo.jpg"
  windows:
    generate: true
    image_path: "assets/imgs/logo.jpg"
    icon_size: 48 # min:48, max:256, default: 48

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  mocktail: ^1.0.1
  mockito: ^5.4.3
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/
    - assets/imgs/bancos/
    - assets/imgs/profiles/
    - assets/svgs/home_page/
    - assets/svgs/categories/
